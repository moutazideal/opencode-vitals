name: Bug report
description: Something behaves differently from what the README says
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The two commands below answer most of the question
        on their own; both write nothing. Please do not paste conversation text
        (prompts or responses) — this plugin does not store it, and a report
        should not either. Timings, counts and identifiers are enough.

  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, and what you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What I expected instead
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true

  - type: input
    id: opencode
    attributes:
      label: OpenCode version

  - type: input
    id: node
    attributes:
      label: Node version
      description: The output of `node --version`.

  - type: textarea
    id: selftest
    attributes:
      label: Selftest output
      description: Run `npx opencode-vitals@latest selftest` and paste the whole output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: installed
    attributes:
      label: What is installed
      description: If the readout is not appearing at all, paste `npx opencode-vitals@latest status` and `opencode plugin list`.
      render: shell

  - type: textarea
    id: startup
    attributes:
      label: If OpenCode will not start
      description: |
        The plugin points the app's launcher at a local server, so if that server
        has nothing to serve the window comes up empty. One command undoes it, and
        is safe to run before reporting anything: `rm -f ~/.local/share/applications/ai.opencode.desktop.desktop`.
        Say here whether you ran it, and whether the app opened after.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not pasted any conversation text (prompts or responses).
          required: true
