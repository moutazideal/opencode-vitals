name: Release

# The version in package.json is the single source of truth. Bump it, write the
# changelog entry, commit: this workflow cuts the tag and publishes the release.
# A version that is already tagged is skipped, so pushing again is safe.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the release without tagging or publishing
        type: boolean
        default: true

permissions:
  contents: write

# Two runs must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the tag is cut against the checked-out commit, and the
          # previous release notes are read out of the changelog.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip when this version is already released
        id: state
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged. Nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "package.json is at $VERSION and v$VERSION is not tagged."
          fi

      - name: Build the release notes from the changelog
        id: notes
        if: steps.state.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # One version's section: from its '## [x.y.z]' heading up to whatever
          # ends it. H3 subsections (### Added) belong to the section, so only an
          # H1, another H2, or the link definitions that close the file stop it.
          awk -v ver="$VERSION" '
            /^## \[/      { p = (index($0, "## [" ver "]") == 1); if (p) print; next }
            /^# /         { p = 0; next }
            /^## /        { p = 0; next }
            /^\[[^]]+\]:/ { p = 0; next }
            p             { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section, so this release would have no notes. Add the entry and commit it first."
            exit 1
          fi

          {
            cat notes.md
            echo
            echo "---"
            echo
            echo "Upgrade: \`npx opencode-vitals install\`"
          } > release-notes.md

          echo "notes: $(wc -l < release-notes.md) lines from the changelog"

      - name: Run the test suite
        # The last gate before the code ships: a failing suite stops the tag
        # rather than becoming somebody's next bug report.
        if: steps.state.outputs.released == 'false'
        run: npm test

      - name: Decide whether to publish
        id: decide
        if: steps.state.outputs.released == 'false'
        env:
          # Empty on a push, which means publish.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: the release is reported but not published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v$VERSION" -m "OpenCode Vitals $VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" \
            --title "OpenCode Vitals $VERSION" \
            --notes-file release-notes.md

      - name: Report
        if: always() && steps.state.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ steps.decide.outputs.publish }}" = "true" ]; then
            echo "Released https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          else
            echo "### OpenCode Vitals $VERSION"
            echo
            cat release-notes.md
            echo
            echo "_Not published. Set dry_run to false, or push the version bump._"
            {
              echo "## OpenCode Vitals $VERSION"
              echo
              cat release-notes.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
